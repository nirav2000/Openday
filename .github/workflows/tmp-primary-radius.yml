name: Temporary discover primary schools near UB5 6QX
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-primary-radius.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Query London Schools layer
        run: |
          python3 - <<'PY'
          import json, math, urllib.parse, urllib.request
          x0,y0=511286,184166
          where="establishmentstatus__name_='Open' AND phaseofeducation__name_ IN ('Primary','All-through')"
          params={
            'f':'json','where':where,'outFields':'urn,establishmentname,postcode,schoolwebsite,town,phaseofeducation__name_,typeofestablishment__name_,easting,northing,statutorylowage,statutoryhighage',
            'returnGeometry':'false','resultRecordCount':'2000'
          }
          url='https://gis.london.gov.uk/arcgis/rest/services/apps/ESOL_webmap/MapServer/3/query?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':'Openday/1.0'})
          data=json.load(urllib.request.urlopen(req,timeout=60))
          out=[]
          for f in data.get('features',[]):
            a=f.get('attributes',{})
            try:x=float(a.get('easting')); y=float(a.get('northing'))
            except:continue
            miles=math.hypot(x-x0,y-y0)/1609.344
            if miles<=5.0 and 'special' not in str(a.get('typeofestablishment__name_','')).lower():
              a['distanceMiles']=round(miles,2); out.append(a)
          out.sort(key=lambda r:(r['distanceMiles'],r.get('establishmentname') or ''))
          print(json.dumps(out,indent=2))
          print('COUNT',len(out))
          PY
