name: Temporary build primary radius catalogue
on:
  push:
    branches: [main]
    paths:
      - 'scripts/expand-primary-radius.py'
      - '.github/workflows/tmp-primary-radius.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand primary catalogue from UB5 6QX
        run: python3 scripts/expand-primary-radius.py
      - name: Commit generated catalogue
        run: |
          if git diff --quiet -- data/primary-schools.json; then
            echo "No catalogue change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/primary-schools.json
          git commit -m "Expand primary catalogue around UB5 6QX"
          git pull --rebase origin main
          git push origin HEAD:main
