name: Test school-measures calculators
on:
  push:
    branches: [main]
    paths:
      - 'measures.html'
      - 'measures.js'
      - 'measures.css'
      - 'tests/measures.test.cjs'
      - '.github/workflows/measures-guide.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: node --check measures.js
      - name: Validate example calculations and edge cases
        run: node tests/measures.test.cjs
