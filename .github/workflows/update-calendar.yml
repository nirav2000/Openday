name: Update subscribed calendar

on:
  push:
    branches: [main]
    paths:
      - 'data/schools.json'
      - 'data/primary-schools.json'
      - 'data/enhancements.json'
      - 'scripts/generate-calendar.mjs'
      - '.github/workflows/update-calendar.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar-publisher
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate calendar candidate
        run: node scripts/generate-calendar.mjs
      - name: Commit only when calendar changed
        run: |
          if git diff --quiet -- calendar.ics; then
            echo "calendar.ics is unchanged; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          node scripts/generate-calendar.mjs
          if git diff --quiet -- calendar.ics; then
            echo "calendar.ics became current after rebasing; nothing to publish."
            exit 0
          fi
          git add calendar.ics
          git commit -m "Update subscribed calendar"
          git push origin HEAD:main
