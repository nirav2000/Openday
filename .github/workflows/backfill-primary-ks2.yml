name: Backfill primary KS2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/backfill-primary-ks2.py
      - .github/workflows/backfill-primary-ks2.yml
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/backfill-primary-ks2.py
      - name: Commit results
        run: |
          git add data/primary-performance.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: backfill primary KS2'
          git pull --rebase origin main
          git push origin HEAD:main
