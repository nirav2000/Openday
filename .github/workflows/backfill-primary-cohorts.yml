name: Backfill primary cohort context
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill-primary-cohorts.py'
      - '.github/workflows/backfill-primary-cohorts.yml'
permissions:
  contents: write
concurrency:
  group: openday-primary-cohort
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import DfE Year 6 cohort and intake data
        run: python3 scripts/backfill-primary-cohorts.py
      - name: Validate preserved attainment results
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/primary-cohort-context.json'))
          assert d['meta']['coverage']['2024/25']>=100
          assert d['meta']['coverage']['2023/24']>=100
          p=d['schools']['131577']['years']['2024/25']
          assert 1 <= p['eligibleYear6'] <= 500
          for name in ('disadvantagedPercent','ealPercent','senSupportPercent','ehcpPercent'):
              if name in p: assert 0 <= p[name] <= 100
          a=json.load(open('data/primary-performance.json'))
          assert a['schools']['131577']['years']['2024/25']['combinedExpected'] >= 0
          PY
      - name: Commit additive public cohort data
        run: |
          git add data/primary-cohort-context.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: backfill dated primary cohort and pupil-intake context'
          git pull --rebase origin main
          git push origin HEAD:main
