name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check integrations.js
          node --check plugins/app-platform.js
          node --check plugins/autosave.js
          node --check plugins/firebase-token-sync.js
          node --check plugins/developer-notes.js
          node --check plugins/version-lab.js
          node --check plugins/firebase-auth.js
          node --check plugins/personal-updates.js
          node --check plugins/public-overrides.js
          node --check scripts/build-version-lab.mjs
          node -e "JSON.parse(require('fs').readFileSync('data/schools.json','utf8'));JSON.parse(require('fs').readFileSync('data/primary-schools.json','utf8'));JSON.parse(require('fs').readFileSync('data/enhancements.json','utf8'));"
      - name: Validate semantic version
        run: |
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('version.json','utf8')).version;if(!/^\\d+\\.\\d+\\.\\d+$/.test(v))throw Error('version.json must contain SemVer x.y.z');const html=fs.readFileSync('index.html','utf8');if(!html.includes('v'+v)||!html.includes('?v='+v))throw Error('index.html version/cache bust does not match version.json');console.log('Release',v)"
      - name: Build exact Version Lab snapshots
        run: node scripts/build-version-lab.mjs
      - name: Generate subscribable calendar
        run: node scripts/generate-calendar.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
