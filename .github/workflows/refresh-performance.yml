name: Refresh school performance data
on:
  workflow_dispatch:
  schedule:
    - cron: '25 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/build-performance-data.py'
      - '.github/workflows/refresh-performance.yml'
      - 'data/schools.json'
permissions:
  contents: write
concurrency:
  group: performance-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build performance dataset from DfE official CSVs
        run: python3 scripts/build-performance-data.py
      - name: Commit refreshed dataset when changed
        run: |
          if [ -z "$(git status --porcelain -- data/performance.json)" ]; then
            echo "No performance data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/performance.json
          git commit -m "Refresh official school performance data"
          git pull --rebase origin main
          git push origin main
