name: Temporary inspect GCSE subject rows
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-inspect-gcse-subjects.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact DfE rows
        run: |
          python3 - <<'PY'
          import csv,io,urllib.request
          url='https://explore-education-statistics.service.gov.uk/data-catalogue/data-set/49abed18-1c61-489f-afc0-11f501335da1/csv'
          req=urllib.request.Request(url,headers={'User-Agent':'Openday inspect/1.0'})
          reader=csv.DictReader(io.TextIOWrapper(urllib.request.urlopen(req,timeout=180),encoding='utf-8-sig',newline=''))
          print('FIELDS',reader.fieldnames)
          for row in reader:
            urn=str(row.get('school_urn') or '')
            if urn in {'135600','136290','141526'} and row.get('subject') in {'Combined Science','Mathematics','Other Modern Languages'}:
              print('ROW', {k:v for k,v in row.items() if v not in ('','z','x')})
          PY
