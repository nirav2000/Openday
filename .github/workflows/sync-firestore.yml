name: Sync Openday catalogue to Firestore

on:
  push:
    branches: [main]
    paths:
      - 'data/schools.json'
      - 'data/primary-schools.json'
      - 'data/enhancements.json'
      - 'version.json'
      - 'scripts/sync-firestore.mjs'
      - '.github/workflows/sync-firestore.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalogue
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/schools.json','utf8'));JSON.parse(require('fs').readFileSync('data/primary-schools.json','utf8'));JSON.parse(require('fs').readFileSync('data/enhancements.json','utf8'));"
          node --check scripts/sync-firestore.mjs
      - name: Require Firebase sync credential
        env:
          OPENDAY_FIREBASE_PASSWORD: ${{ secrets.OPENDAY_FIREBASE_PASSWORD }}
        run: |
          if [ -z "$OPENDAY_FIREBASE_PASSWORD" ]; then
            echo "Add repository secret OPENDAY_FIREBASE_PASSWORD using the same memorable token/password as the dedicated Openday Firebase Authentication account."
            exit 1
          fi
      - name: Mirror catalogue to Firestore
        env:
          OPENDAY_FIREBASE_PASSWORD: ${{ secrets.OPENDAY_FIREBASE_PASSWORD }}
        run: node scripts/sync-firestore.mjs
